<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>拍照上传错题</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#f2f5fb;min-height:100vh;color:#1f2733}
  .wrap{max-width:520px;margin:0 auto;padding:20px 16px 48px}
  .hero{background:linear-gradient(120deg,#2f6bff,#6c4dff);border-radius:18px;padding:20px;color:#fff;margin-bottom:16px;box-shadow:0 8px 24px rgba(76,92,255,.28)}
  .hero h1{font-size:19px;font-weight:800;margin-bottom:5px}
  .hero p{font-size:13px;opacity:.92;line-height:1.6}
  .card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(20,40,80,.06)}
  .fld{padding:2px 0}
  .fld + .fld{border-top:1px solid #f1f4fa;margin-top:12px;padding-top:14px}
  .fld label{display:block;font-size:14px;font-weight:700;margin-bottom:10px}
  .fld label .opt{font-size:12px;color:#98a2b3;font-weight:400;margin-left:6px}
  .fld label .req{color:#e5484d;margin-left:2px}
  .subj-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .subj-chip{border:1.5px solid #dfe6f3;background:#fbfcff;border-radius:10px;padding:9px 0;font-size:14px;font-weight:600;color:#5b6779;cursor:pointer;transition:.15s;font-family:inherit}
  .subj-chip.on{border-color:#2f6bff;background:#e8f1ff;color:#2f6bff;font-weight:700}
  .r9-modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.r9-mode{border:1px solid #dfe6f3;border-radius:10px;background:#fff;padding:10px 4px;color:#53647c;cursor:pointer}.r9-mode.on{border-color:#2f6bff;color:#2f6bff;background:#edf4ff}.r9-edit{position:absolute;bottom:3px;left:3px;right:3px;border:0;border-radius:7px;padding:5px;color:#fff;background:#243855c9;font-size:12px}.r9-editor{position:fixed;inset:0;z-index:100;background:#101827ef;display:flex;flex-direction:column;padding:12px;gap:8px}.r9-editor p{color:#fff;line-height:1.5;font-size:13px}.r9-canvas-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}.r9-editor canvas{max-width:100%;max-height:100%;touch-action:none;background:#fff}.r9-tools{display:flex;gap:6px;flex-wrap:wrap}.r9-tools button{flex:1;min-width:68px;padding:10px 6px;border:0;border-radius:8px;font-size:14px}.r9-tools button.on{background:#2f6bff;color:#fff}
  .tip{font-size:12.5px;color:#7a8699;line-height:1.65;margin-bottom:8px}
  .files{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:10px}
  .fslot{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;border:1px dashed #c9d4ea;background:#f7f9fe}
  .fslot img{width:100%;height:100%;object-fit:cover}
  .fslot .r9-file-label{position:absolute;top:4px;left:4px;max-width:calc(100% - 32px);padding:3px 6px;border-radius:6px;background:#243855c9;color:#fff;font-size:11px;line-height:1.2}
  .fslot .del{position:absolute;right:4px;top:4px;width:22px;height:22px;border-radius:50%;border:none;background:rgba(0,0,0,.55);color:#fff;font-size:14px;line-height:22px;cursor:pointer}
  .fslot.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#5b8cff;font-size:12px;cursor:pointer;border:1.5px dashed #9db8f5}
  .fslot.add .plus{font-size:24px;line-height:1}
  input[type=text],textarea{width:100%;border:1px solid #dfe6f3;border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;background:#fbfcff;color:#1f2733}
  textarea{resize:none;min-height:60px}
  input:focus,textarea:focus{outline:none;border-color:#2f6bff;background:#fff}
  .picker{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid #dfe6f3;border-radius:10px;padding:10px 12px;font-size:14px;cursor:pointer;background:#fbfcff;margin-bottom:9px}
  .picker:active{border-color:#2f6bff}
  .picker .ph{color:#98a2b3}
  .picker .v{color:#1f2733;font-weight:600}
  .picker .arr{color:#c0c9d8;font-weight:700}
  .btn{display:block;width:100%;border:none;border-radius:999px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;transition:.15s}
  .btn-primary{background:linear-gradient(135deg,#2f6bff,#6c4dff);color:#fff;box-shadow:0 6px 16px rgba(47,107,255,.32)}
  .btn:disabled{opacity:.5;box-shadow:none}
  .ok-box{text-align:center;padding:30px 10px}
  .ok-box .ic{font-size:52px}
  .ok-box b{display:block;font-size:18px;margin:12px 0 8px}
  .ok-box p{font-size:13px;color:#7a8699;line-height:1.7}
  .ulist{display:flex;flex-direction:column;gap:10px}
  .uitem{display:flex;align-items:center;gap:10px}
  .uitem img{width:52px;height:52px;border-radius:8px;object-fit:cover;border:1px solid #eef1f8}
  .uitem .m{flex:1;min-width:0}
  .uitem .m b{font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .uitem .m span{font-size:12px;color:#98a2b3}
  .badge{font-size:11px;border-radius:999px;padding:3px 10px;font-weight:600;flex-shrink:0}
  .b-wait{background:#fff4e0;color:#c47b0a}
  .b-ok{background:#e2f9ec;color:#0e9f5d}
  .b-no{background:#ffe8e8;color:#d5323a}
  .err{background:#ffecec;color:#d5323a;border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:14px;display:none}
  .foot{text-align:center;font-size:12px;color:#a5aec0;margin-top:22px}
  /* 错误类型 / 年级 底部选择弹层 */
  .sheet-mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:520px;padding:10px 0 calc(14px + env(safe-area-inset-bottom));animation:sheetUp .2s ease-out}
  @keyframes sheetUp{from{transform:translateY(40%);opacity:.4}to{transform:none;opacity:1}}
  .sheet .st{display:flex;align-items:center;justify-content:space-between;padding:10px 18px 6px}
  .sheet .st b{font-size:15px}
  .sheet .st .x{border:none;background:none;font-size:20px;color:#98a2b3;cursor:pointer;padding:4px}
  .sheet .so{display:block;width:100%;text-align:center;border:none;background:none;font-size:15px;color:#1f2733;padding:13px;cursor:pointer}
  .sheet .so:active{background:#f2f6ff}
  .sheet .so.on{color:#2f6bff;font-weight:700}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="hero">
    <h1>📷 拍照上传错题</h1>
    <p id="greet">正在验证访问凭证…</p>
  </div>
  <div class="err" id="err"></div>
  <div id="main" style="display:none">
    <div class="card">
      <div class="fld">
        <label>学科<span class="req">*</span></label>
        <div class="subj-row" id="subjRow"></div>
      </div>
      <div class="fld">
        <label>上传方式</label>
        <div class="r9-modes" id="modes"><button type="button" class="r9-mode on" data-mode="single">单题</button><button type="button" class="r9-mode" data-mode="pages">跨页题</button><button type="button" class="r9-mode" data-mode="split">多题拆分</button></div>
        <label>题干照片</label>
        <p class="tip" id="modeTip">拍摄一道完整题目，保持光线充足、文字清晰。点击照片可圈出错误。</p>
        <div class="files" id="files"></div>
        <input type="file" id="picker" accept="image/*" capture="environment" multiple style="display:none">
        <textarea id="stemText" maxlength="500" placeholder="输入文字描述题目（选填）"></textarea>
      </div>
    </div>
    <div class="card">
      <div class="fld">
        <label>答案<span class="opt">选填</span></label>
        <input type="text" id="answer" maxlength="500" placeholder="写下你的答案或卡住的地方（选填）">
      </div>
    </div>
    <div class="card">
      <div class="fld">
        <label>所属学期 / 章节<span class="opt">选填</span></label>
        <div class="picker" id="gradePick"><span class="ph">选择年级</span><span class="arr">›</span></div>
        <input type="text" id="chapter" maxlength="200" placeholder="如：三年级上 / 苏教版 / 两、三位数乘一位数（选填）">
      </div>
      <div class="fld">
        <label>所属知识点<span class="opt">选填</span></label>
        <input type="text" id="point" maxlength="100" placeholder="如：两位数乘一位数（选填，老师会核对）">
      </div>
      <div class="fld">
        <label>错误类型<span class="opt">选填</span></label>
        <div class="picker" id="errPick"><span class="ph">选择错误类型</span><span class="arr">›</span></div>
      </div>
    </div>
    <div class="card">
      <div class="fld">
        <label>给老师的留言<span class="opt">选填</span></label>
        <textarea id="note" maxlength="200" placeholder="比如：这道题想不明白了，帮我讲讲～"></textarea>
      </div>
    </div>
    <button class="btn btn-primary" id="submit">提交给老师审核</button>
    <div class="card" style="margin-top:16px">
      <h2 style="font-size:15px;font-weight:700;margin-bottom:12px">我上传的错题</h2>
      <div class="ulist" id="ulist"><p class="tip">加载中…</p></div>
    </div>
  </div>
  <div class="foot">智学课堂 · 错题本上传通道</div>
</div>
<script>
(function () {
  var token = new URLSearchParams(location.search).get('t') || '';
  var files = [];            // File 对象
  var isTeacher = false, draftKey = '', draft = {requestKeys:{}}, restoring = false;
  var MAX = 4, MAXMB = 10, mode = 'single';
  var $ = function (s) { return document.querySelector(s); };
  var showErr = function (msg) { var e = $('#err'); e.textContent = msg; e.style.display = 'block'; window.scrollTo(0, 0); };

  var GRADES = ['三年级', '四年级', '五年级', '六年级', '七年级', '八年级', '九年级'];
  var ERR_TYPES = ['题型生疏', '审题错误', '看错抄错', '未按要求', '概念不清', '步骤不全', '计算失误', '其他'];
  var SUBJS = ['数学', '英语', '物理', '化学'];
  var grade = '', errorType = '';
  var subject = SUBJS.indexOf(new URLSearchParams(location.search).get('subject') || '') >= 0
    ? new URLSearchParams(location.search).get('subject') : '';

  if (!token) { $('#greet').textContent = '链接无效，请回到错题本重新获取二维码'; return; }

  api('info', null, function (d) {
    isTeacher = !!d.teacher;
    if (isTeacher) {
      document.querySelector('.hero h1').textContent = '手机拍照录题';
      document.querySelector('.foot').textContent = '智学课堂 · 教师录题通道';
      document.querySelector('#ulist').closest('.card').style.display = 'none';
      $('#submit').textContent = '提交到待审核';
    }
    $('#greet').textContent = isTeacher ? '你好，' + (d.name || '老师') + '，选择学科和年级，拍照后提交到待审核。' : '你好，' + (d.name || '同学') + (d.grade ? '（' + d.grade + '）' : '') + '，把不会的题拍下来交给老师吧！';
    if (!grade && d.grade && GRADES.indexOf(d.grade) >= 0) { grade = d.grade; paintPicks(); }
    $('#main').style.display = '';
    restoreDraft(d.upload_scope);
    if(isTeacher && d.defaults){if(d.defaults.subject)subject=d.defaults.subject;paintPicks();var scopeNote=document.createElement('p');scopeNote.className='hint';scopeNote.textContent='资料范围：'+[d.defaults.subject,d.defaults.edition,d.defaults.term,({textbook:'教材',exercise:'练习',paper:'试卷',other:'其他'})[d.defaults.material_type]].filter(Boolean).join(' · ');$('#greet').after(scopeNote);draft.signedScope=JSON.stringify(d.defaults);}
    if (!isTeacher) loadMine();
  }, function (msg) { $('#greet').textContent = msg || '二维码已过期，请回到错题本重新获取'; });

  function api(path, body, onOk, onErr, isForm, requestKey) {
    var opt = { method: body ? 'POST' : 'GET', headers: {} };
    if (requestKey) opt.headers['X-Intake-Key'] = requestKey;
    var controller = window.AbortController ? new AbortController() : null; if(controller)opt.signal=controller.signal;
    var timeout=setTimeout(function(){if(controller)controller.abort();},120000);
    if (body) opt.body = isForm ? body : JSON.stringify(body);
    if (!isForm && body) opt.headers['Content-Type'] = 'application/json';
    var sep = path.indexOf('?') >= 0 ? '&' : '?';
    fetch('/api/up/' + path + sep + 't=' + encodeURIComponent(token), opt)
      .then(function (r) { clearTimeout(timeout); return r.json().catch(function () { throw new Error('网络异常，请稍后重试'); }); })
      .then(function (j) {
        if (j.code === 0) onOk && onOk(j.data);
        else {
          if (j.code === 401) { $('#main').style.display = 'none'; }
          onErr && onErr(j.msg || '操作失败'); if (!onErr) showErr(j.msg || '操作失败');
        }
      })
      .catch(function (e) { clearTimeout(timeout); var message=e.name==='AbortError'?'等待超时，保存结果未确认。可查询结果或重新选择同一照片重试，不会重复提交。':'网络连接中断，保存结果未确认。可查询上次结果或用相同照片重试。'; onErr && onErr(message); if (!onErr) showErr(message || '网络异常'); });
  }

  function saveDraft() {
    if(!draftKey || restoring || !$('#stemText'))return;
    draft.fields={subject:subject,grade:grade,errorType:errorType,mode:mode};
    ['stemText','answer','chapter','point','note'].forEach(function(id){draft.fields[id]=$('#'+id).value;});
    try{localStorage.setItem(draftKey,JSON.stringify(draft));}catch(e){showErr('浏览器未允许保存本机草稿，请及时提交；关闭页面后可能无法恢复。');}
  }
  function restoreDraft(scope) {
    if(!scope)return;draftKey='zx-upload-draft:'+scope;restoring=true;
    try{var saved=JSON.parse(localStorage.getItem(draftKey)||'null');if(saved && saved.fields){draft=saved;var f=saved.fields;subject=SUBJS.indexOf(f.subject)>=0?f.subject:subject;grade=GRADES.indexOf(f.grade)>=0?f.grade:grade;errorType=ERR_TYPES.indexOf(f.errorType)>=0?f.errorType:'';['stemText','answer','chapter','point','note'].forEach(function(id){if(typeof f[id]==='string')$('#'+id).value=f[id];});if(['single','pages','split'].indexOf(f.mode)>=0){var modeButton=$('#modes [data-mode="'+f.mode+'"]');if(modeButton)modeButton.click();}paintPicks();}}
    catch(e){}restoring=false;
    var notice=document.createElement('div');notice.className='card';notice.id='uploadResume';notice.innerHTML='<p class="tip" id="uploadResumeText">文字草稿保存在本机，关闭页面后可恢复；照片需要重新选择。</p><button type="button" class="btn" id="uploadCheck" style="display:none">查询上次提交结果</button><button type="button" class="btn" id="uploadClear">清除本机草稿</button>';
    $('#main').prepend(notice);
    $('#uploadClear').onclick=function(){if(!confirm('仅清除本机草稿，已经提交的记录不受影响。'))return;try{localStorage.removeItem(draftKey);}catch(e){}location.reload();};
    if(draft.lastKey){$('#uploadCheck').style.display='';$('#uploadCheck').onclick=function(){api('status?key='+encodeURIComponent(draft.lastKey),null,function(d){$('#uploadResumeText').textContent=d.found?'上次提交已保存到待审核，不必再次提交；其他题目请另行选择。':'暂未查到保存结果，可重新选择原照片重试。';},showErr);};}
  }
  async function submissionKey(fd) {
    var parts=[];
    for (var entry of fd.entries()) {
      if(typeof entry[1]==='string')parts.push(entry);
      else {var bytes=new Uint8Array(await entry[1].arrayBuffer()),a=2166136261,b=5381;for(var value of bytes){a=Math.imul(a^value,16777619);b=Math.imul(b,33)^value;}parts.push([entry[0],entry[1].size,a>>>0,b>>>0]);}
    }
    var signature=JSON.stringify(parts);if(!draft.requestKeys)draft.requestKeys={};
    if(!draft.requestKeys[signature])draft.requestKeys[signature]=window.crypto && crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)+'-'+Math.random().toString(36).slice(2);
    draft.lastKey=draft.requestKeys[signature];saveDraft();return draft.lastKey;
  }
  $('#main').addEventListener('input',saveDraft);
  // ---- 底部选择弹层 ----
  function openSheet(title, options, current, onPick) {
    var mask = document.createElement('div'); mask.className = 'sheet-mask';
    var html = '<div class="sheet"><div class="st"><b>' + title + '</b><button class="x">✕</button></div>';
    if (current) html += '<button class="so" data-v="">不填</button>';
    options.forEach(function (o) { html += '<button class="so' + (o === current ? ' on' : '') + '" data-v="' + o + '">' + o + '</button>'; });
    html += '</div>';
    mask.innerHTML = html;
    document.body.appendChild(mask);
    mask.addEventListener('click', function (e) { if (e.target === mask) mask.remove(); });
    mask.querySelector('.x').onclick = function () { mask.remove(); };
    mask.querySelectorAll('.so').forEach(function (b) {
      b.onclick = function () { onPick(b.dataset.v || ''); mask.remove(); };
    });
  }

  function paintPicks() {
    $('#subjRow').innerHTML = SUBJS.map(function (s) {
      return '<button type="button" class="subj-chip' + (subject === s ? ' on' : '') + '" data-s="' + s + '">' + s + '</button>';
    }).join('');
    $('#subjRow').querySelectorAll('.subj-chip').forEach(function (b) {
      b.onclick = function () { subject = b.dataset.s; paintPicks(); };
    });
    $('#gradePick').innerHTML = '<span class="' + (grade ? 'v' : 'ph') + '">' + (grade || '选择年级') + '</span><span class="arr">›</span>';
    saveDraft();
    $('#errPick').innerHTML = '<span class="' + (errorType ? 'v' : 'ph') + '">' + (errorType || '选择错误类型') + '</span><span class="arr">›</span>';
  }
  paintPicks();
  $('#gradePick').onclick = function () { openSheet('所属年级', GRADES, grade, function (v) { grade = v; paintPicks(); }); };
  $('#errPick').onclick = function () { openSheet('错误类型', ERR_TYPES, errorType, function (v) { errorType = v; paintPicks(); }); };

  var tips = { single: '拍摄一道完整题目，保持光线充足、文字清晰。点击照片可圈出错误。', pages: '同一道跨页题按顺序上传 2–4 张，点击照片可圈出错误。', split: '点原图选择「框出一题」，逐题框选并点击完成。每个框会作为一道题提交，最多 4 道。题干和答案请由老师分别核对。' };
  $('#modes').querySelectorAll('button').forEach(function (b) { b.onclick = function () {
    mode = b.dataset.mode;
    $('#modes').querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
    $('#modeTip').textContent = tips[mode];
    $('#stemText').style.display = mode === 'split' ? 'none' : '';
    $('#answer').closest('.card').style.display = mode === 'split' ? 'none' : '';
    paintFiles();saveDraft();
  }; });
  // 图片直接绘制标记；框题生成独立图片，提交时仍使用普通文件上传接口。
  function editImage(index) {
    var item = files[index], overlay = document.createElement('div'); overlay.className = 'r9-editor';
    overlay.innerHTML = '<p>在图片上拖动圈出错误；多题拆分时选择“框出一题”，依次框选每道题。</p><div class="r9-canvas-wrap"><canvas></canvas></div><div class="r9-tools"><button type="button" data-tool="draw" class="on">圈出错误</button><button type="button" data-tool="crop">框出一题</button><button type="button" data-tool="undo">撤销</button><button type="button" data-tool="done">完成</button><button type="button" data-tool="cancel">取消</button></div>';
    document.body.appendChild(overlay);
    var canvas = overlay.querySelector('canvas'), ctx = canvas.getContext('2d'), img = new Image(), tool = 'draw', drawing = false, start = null, snapshot = null, dirty = false;
    var newCrops = [], pendingCrops = 0, editorClosed = false, lastAction = '';
    var doneButton = overlay.querySelector('[data-tool=done]');
    img.onload = function () { var scale = Math.min(1, 2400 / Math.max(img.width, img.height)); canvas.width = Math.round(img.width * scale); canvas.height = Math.round(img.height * scale); ctx.drawImage(img, 0, 0, canvas.width, canvas.height); };
    img.onerror = function () { overlay.remove(); showErr('图片无法打开，请换一张 JPG 或 PNG 照片'); };
    img.src = item.url;
    function point(e) { var r = canvas.getBoundingClientRect(); return { x: (e.clientX-r.left)*canvas.width/r.width, y: (e.clientY-r.top)*canvas.height/r.height }; }
    canvas.onpointerdown = function (e) { e.preventDefault(); if (!canvas.width) return; canvas.setPointerCapture(e.pointerId); drawing = true; start = point(e); snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height); ctx.strokeStyle = '#ed2637'; ctx.lineWidth = Math.max(3, canvas.width/220); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(start.x,start.y); };
    canvas.onpointermove = function (e) { if (!drawing) return; e.preventDefault(); var p = point(e); if (tool === 'crop') { ctx.putImageData(snapshot,0,0); ctx.strokeRect(start.x,start.y,p.x-start.x,p.y-start.y); } else { ctx.lineTo(p.x,p.y); ctx.stroke(); dirty=true; lastAction='draw'; } };
    canvas.onpointerup = function (e) {
      if (!drawing) return; drawing=false; if (tool !== 'crop') return;
      var end=point(e), x=Math.max(0,Math.floor(Math.min(start.x,end.x))), y=Math.max(0,Math.floor(Math.min(start.y,end.y))), w=Math.min(canvas.width-x,Math.floor(Math.abs(end.x-start.x))), h=Math.min(canvas.height-y,Math.floor(Math.abs(end.y-start.y)));
      ctx.putImageData(snapshot,0,0); if (w<20 || h<20) return;
      if (files.filter(function(f){return f.split;}).length + newCrops.length + pendingCrops >= MAX) { alert('最多拆分 4 道题，请先提交或删除多余图片'); return; }
      var cut=document.createElement('canvas'); cut.width=w; cut.height=h; cut.getContext('2d').drawImage(canvas,x,y,w,h,0,0,w,h);
      pendingCrops++; doneButton.disabled=true;
      cut.toBlob(function(blob){
        pendingCrops--; doneButton.disabled=!!pendingCrops;
        if (!blob || editorClosed) return;
        var file=new File([blob],'question.png',{type:'image/png'});
        newCrops.push({file:file,url:URL.createObjectURL(file),split:true}); lastAction='crop';
        overlay.querySelector('p').textContent='已框出 '+newCrops.length+' 题；可继续框选，或点击完成。';
      },'image/png');
    };
    overlay.querySelectorAll('[data-tool]').forEach(function (b) { b.onclick=function () {
      var action=b.dataset.tool;
      if(action==='draw'||action==='crop'){tool=action;overlay.querySelectorAll('[data-tool=draw],[data-tool=crop]').forEach(function(x){x.classList.toggle('on',x===b);});}
      else if(action==='undo'){
        if (lastAction==='crop' && newCrops.length) { var removed=newCrops.pop(); URL.revokeObjectURL(removed.url); overlay.querySelector('p').textContent='已框出 '+newCrops.length+' 题；可继续框选，或点击完成。'; }
        else if(snapshot){ctx.putImageData(snapshot,0,0);snapshot=null;}
        lastAction='';
      } else if(action==='cancel'){
        editorClosed=true; newCrops.forEach(function(f){URL.revokeObjectURL(f.url);}); overlay.remove();
      } else if(action==='done'){
        var finish=function(){editorClosed=true;newCrops.forEach(function(f){files.push(f);});paintFiles();overlay.remove();};
        if(!dirty){finish();return;}
        doneButton.disabled=true;
        canvas.toBlob(function(blob){if(editorClosed)return;if(blob){URL.revokeObjectURL(item.url);item.file=new File([blob],'marked.png',{type:'image/png'});item.url=URL.createObjectURL(item.file);}finish();},'image/png');
      }
    }; });
  }
  // ---- 图片选择 ----
  function paintFiles() {
    var box = $('#files');
    box.innerHTML = '';
    files.forEach(function (f, i) {
      if (f.split && mode !== 'split') return;
      var d = document.createElement('div'); d.className = 'fslot';
      var number = files.slice(0, i + 1).filter(function(x){return !!x.split === !!f.split;}).length;
      d.innerHTML = '<img src="' + f.url + '" alt="题目照片"><span class="r9-file-label">' + (f.split ? '题目 ' : '原图 ') + number + '</span><button class="del" data-i="' + i + '" aria-label="删除图片">×</button><button type="button" class="r9-edit">' + (f.split ? '标记题目' : '标记 / 框题') + '</button>';
      d.querySelector('.r9-edit').onclick = function () { editImage(i); };
      box.appendChild(d);
    });
    if (files.filter(function(f){return !f.split;}).length < MAX) {
      var a = document.createElement('div'); a.className = 'fslot add';
      a.innerHTML = '<span class="plus">＋</span>拍照 / 选图';
      a.onclick = function () { $('#picker').click(); };
      box.appendChild(a);
    }
    box.querySelectorAll('.del').forEach(function (b) {
      b.onclick = function (e) { e.stopPropagation(); var removed = files.splice(Number(b.dataset.i), 1)[0]; if (removed) URL.revokeObjectURL(removed.url); paintFiles(); };
    });
  }
  paintFiles();
  $('#picker').onchange = function () {
    var list = Array.prototype.slice.call(this.files || []);
    this.value = '';
    list.forEach(function (f) {
      if (!/^image\//.test(f.type)) return;
      if (f.size > MAXMB * 1024 * 1024) { showErr('图片太大（超过 ' + MAXMB + 'MB），请拍小一点再试'); return; }
      if (files.filter(function(x){return !x.split;}).length >= MAX) return;
      files.push({ file: f, url: URL.createObjectURL(f) });
    });
    paintFiles();
  };

  // ---- 提交 ----
  $('#submit').onclick = function () {
    var originals = files.filter(function(f){return !f.split;});
    if (!files.length) return showErr('请先拍照或选择至少 1 张图片');
    if (!subject) return showErr('请先选择学科');
    if (isTeacher && !grade) return showErr('请先选择年级');
    if (mode === 'pages' && originals.length < 2) return showErr('跨页题请按顺序上传至少 2 张照片');
    var groups = mode === 'split' ? files.filter(function(f){return f.split;}).map(function(f){return [f];}) : [originals];
    if (mode === 'split' && !groups.length) return showErr('请先打开照片，使用“框出一题”框选每一道题');
    if (mode !== 'split' && !originals.length) return showErr('请先拍照或选择至少 1 张原图');
    var btn = this, sent = 0; btn.disabled = true; btn.textContent = '上传中…';
    async function sendNext() {
      var group = groups.shift(); if (!group) { $('#main').innerHTML = '<div class="card ok-box"><b>上传成功！</b><p>已提交 ' + sent + ' 道题，老师可以查看原图和标记。</p><button type="button" class="btn btn-primary" id="uploadAgain">继续录题</button></div>'; $('#uploadAgain').onclick=function(){draft={fields:{subject:subject,grade:grade},requestKeys:{}};try{localStorage.setItem(draftKey,JSON.stringify(draft));}catch(e){}location.reload();}; return; }
      var fd = new FormData(); group.forEach(function(f){fd.append('images',f.file);});
      if(isTeacher)fd.append('_signed_scope',draft.signedScope || '{}');fd.append('subject',subject);fd.append('stem_text',mode === 'split' ? '' : $('#stemText').value.trim());fd.append('answer',mode === 'split' ? '' : $('#answer').value.trim());fd.append('grade',grade);fd.append('chapter',$('#chapter').value.trim());fd.append('point',$('#point').value.trim());fd.append('error_type',errorType);
      fd.append('note', (mode === 'pages' ? '【跨页题】' : mode === 'split' ? '【多题拆分】' : '') + $('#note').value.trim());
      var requestKey;try{requestKey=await submissionKey(fd);}catch(e){btn.disabled=false;return showErr('准备上传失败，请重试');}
      api('submit',fd,function(){sent++;group.forEach(function(f){var i=files.indexOf(f);if(i>=0)files.splice(i,1);URL.revokeObjectURL(f.url);});sendNext();},function(msg){btn.disabled=false;btn.textContent='提交给老师审核';paintFiles();showErr((sent ? '已成功提交 '+sent+' 道，剩余题目未提交。' : '')+(msg || '上传失败，请重试'));},true,requestKey);
    }
    sendNext();
  };

  // ---- 我的上传 ----
  function loadMine() {
    api('mine', null, function (d) {
      var box = $('#ulist');
      var ST = { pending: ['待审核', 'b-wait'], reviewed: ['已核对', 'b-ok'], approved: ['已入库', 'b-ok'], rejected: ['未通过', 'b-no'] };
      if (!d.list || !d.list.length) { box.innerHTML = '<p class="tip">还没有上传记录，上面拍完点提交吧。</p>'; return; }
      box.innerHTML = d.list.map(function (u) {
        var st = ST[u.status] || ['未知', 'b-wait'];
        var img = (u.images && u.images[0]) || '';
        var name = u.stem_text || u.point || u.error_type || (u.grade ? u.grade + '错题' : '错题照片');
        return '<div class="uitem">' + (img ? '<img src="' + img + '">' : '')
          + '<div class="m"><b>' + escHtml(name) + '</b>'
          + '<span>' + [u.error_type, u.point, String(u.created_at || '').slice(0, 16)].filter(Boolean).join(' · ') + '</span></div>'
          + '<span class="badge ' + st[1] + '">' + st[0] + '</span></div>';
      }).join('');
    });
  }
  function escHtml(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
})();
</script>

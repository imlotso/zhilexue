<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>校区成绩管理与进步追踪系统</title>
<link rel="stylesheet" href="assets/css/style.css?v=20261022c" />
<link rel="stylesheet" href="assets/css/rounded-workspace.css?v=20261109a">
</head>
<body class="rounded-grades">

<div id="app">
  <!-- ============ 顶部栏（仅品牌；校区选择置于各页筛选区） ============ -->
  <header class="topbar">
    <div class="topbar-left">
      <div class="brand">
        <span class="brand-mark">成</span>
        <div class="brand-text">
          <strong>校区成绩管理</strong>
          <span id="brandTag">加载中…</span>
        </div>
      </div>
    </div>
    <div class="topbar-right">
      <select id="topCampus" class="top-campus" title="切换校区" hidden></select>
    </div>
  </header>

  <div class="layout">
    <!-- ============ 侧边导航 ============ -->
    <aside class="sidebar">
      <nav>
        <a href="#/dashboard" class="nav-item" data-nav="dashboard"><i>◪</i>总览看板<span class="nav-tag">结论</span></a>
        <a href="#/records"   class="nav-item" data-nav="records"><i>☰</i>成绩列表<span class="nav-tag">录入·明细</span></a>
        <a href="#/tracking"  class="nav-item" data-nav="tracking"><i>⇄</i>考试对比<span class="nav-tag">两次对比</span></a>
        <a href="#/students"  class="nav-item" data-nav="students"><i>☺</i>学生档案<span class="nav-tag">个人轨迹</span></a>
      </nav>
      <div class="sidebar-foot">
        <div class="data-stat" id="sideStat"></div>
        <button class="btn btn-ghost btn-sm" id="btnCampusManage">🏫 校区管理</button>
        <button class="btn btn-ghost btn-sm" id="btnPrintPage">🖨 打印当前页</button>
      </div>
    </aside>

    <!-- ============ 主内容 ============ -->
    <main class="main" id="mainView"></main>
  </div>
</div>

<!-- ============ 弹层容器 ============ -->
<div class="modal-root" id="modalRoot" hidden>
  <div class="modal-mask" data-close="1"></div>
  <div class="modal-box" id="modalBox"></div>
</div>

<div class="toast-root" id="toastRoot"></div>

<input type="file" id="fileInput" accept=".xlsx,.xls,.csv" hidden />
<input type="file" id="imageInput" accept="image/*" multiple hidden />
<div id="printArea" class="print-area"></div>

<script src="vendor/xlsx.full.min.js"></script>
<script src="vendor/chart.umd.js"></script>
<script src="vendor/html2canvas.min.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/qrcode.min.js"></script>
<script src="assets/js/util.js?v=20261109a"></script>
<script src="assets/js/store.js?v=20261022c"></script>
<script src="assets/js/analytics.js?v=20261022c"></script>
<script src="assets/js/knowledge.js?v=20261022c"></script>
<script src="assets/js/excel.js?v=20261022c"></script>
<script src="assets/js/exporters.js?v=20261022c"></script>
<script src="assets/js/views/dashboard.js?v=20261022c"></script>
<script src="assets/js/views/records.js?v=20261109a"></script>
<script src="assets/js/views/kndiag.js?v=20261022c"></script>
<script src="assets/js/views/import.js?v=20261022c"></script>
<script src="assets/js/views/tracking.js?v=20261022c"></script>
<script src="assets/js/views/students.js?v=20261109a"></script>
<script src="assets/js/app.js?v=20261109a"></script>
</body>
</html>

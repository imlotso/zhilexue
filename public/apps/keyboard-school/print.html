<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>键盘指法 · 打印资料</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#f2f4f8;color:#28314b}
  .bar{position:sticky;top:0;z-index:9;background:#fff;border-bottom:1px solid #e2e6ef;
       padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .bar h1{font-size:17px}
  .bar button{border:0;background:#4b5bcc;color:#fff;border-radius:8px;padding:9px 20px;
       font-size:14px;font-weight:600;cursor:pointer}
  .bar button:hover{background:#3949b7}
  .bar a{color:#4b5bcc;font-size:13px;text-decoration:none}
  .tip{font-size:12.5px;color:#7a859a}
  main{max-width:900px;margin:0 auto;padding:18px 16px 40px}
  figure{background:#fff;border:1px solid #e6eaf3;border-radius:10px;padding:10px;margin-bottom:18px}
  figcaption{font-size:14px;font-weight:600;padding:4px 4px 10px;display:flex;justify-content:space-between;align-items:center}
  figcaption a{color:#4b5bcc;font-size:12.5px;font-weight:400}
  img{width:100%;display:block;border-radius:6px}
  @media print{
    body{background:#fff}
    .bar,.tip,figcaption a{display:none!important}
    main{max-width:none;padding:0}
    figure{border:0;border-radius:0;padding:0;margin:0;page-break-after:always}
    figure:last-child{page-break-after:auto}
    figcaption{padding:0 0 6px}
    img{border-radius:0}
  }
</style>
</head>
<body>
  <div class="bar">
    <h1>🖨 键盘指法打印资料</h1>
    <button onclick="window.print()">打印全部 3 张</button>
    <a href="index.html">← 返回键盘学堂</a>
    <span class="tip">提示：打印时选择 A4 纸；竖版图用纵向、横版图可在打印设置里选横向</span>
  </div>
  <main>
    <figure>
      <figcaption>① 键盘指法 · 按完键手指回位（A4 竖版）<a href="print/finger-return.jpg" download>下载这张</a></figcaption>
      <img src="print/finger-return.jpg" alt="按完键手指回位">
    </figure>
    <figure>
      <figcaption>② 键盘指法 · 盲打练习正确顺序（A4 横版）<a href="print/blind-order.jpg" download>下载这张</a></figcaption>
      <img src="print/blind-order.jpg" alt="盲打练习正确顺序">
    </figure>
    <figure>
      <figcaption>③ 键盘指法 · 先学这 10 个键（A4 竖版）<a href="print/first10.jpg" download>下载这张</a></figcaption>
      <img src="print/first10.jpg" alt="先学这10个键">
    </figure>
  </main>
</body>
</html>

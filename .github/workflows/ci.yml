name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node bank-test.js
      - run: node wordq-test.js    # Word 规则解析（T3，客户样例文档在 docs/原始需求，不需要数据库）
      - run: node excel-test.js    # Excel 模板解析（T3，同上）

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Start MySQL and create database
        run: |
          sudo systemctl start mysql.service
          PW=$(node -p "require('./src/config.local').mysql.password")
          SQL="ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY '$PW'; CREATE DATABASE IF NOT EXISTS xuexi CHARACTER SET utf8mb4;"
          sudo mysql -e "$SQL" || mysql -uroot -proot -e "$SQL"
      - run: npm run seed
      - run: node storage-test.js
      - name: Start server
        # CI 必须用本地存储：默认驱动是 oss 且内置了线上桶的密钥，smoke/word-test 的上传用例会写进生产 OSS
        env:
          STORAGE_DRIVER: local
          AI_MOCK: '1'   # AI 走演示模式：CI 不调真实 AI 接口（需要 ai.js 支持 AI_MOCK）
        run: |
          nohup npm start > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/ >/dev/null && break; sleep 1; done
      - run: node smoke.js
      - run: node word-test.js
        if: ${{ !cancelled() }}   # smoke 失败时也要跑出结果，不能被跳过
      - run: node wrong-test.js
        if: ${{ !cancelled() }}   # smoke 失败时也要跑出结果，不能被跳过
      - run: node kbtree-test.js
        if: ${{ !cancelled() }}   # 知识树统一（T4）：需要启动时种子树，所以放在服务启动之后
      - run: node pending-test.js
        if: ${{ !cancelled() }}   # 待审核题目（T3）：需要服务和种子树
      - run: node compose-test.js
        if: ${{ !cancelled() }}   # 组卷（T5）：章节树 / 知识点树组卷、定向下发、学生自组卷
      - run: node lessonq-test.js
        if: ${{ !cancelled() }}   # 课文习题（T6）：视频 / 小分组正确率、学习报告、后台按学生查看
      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log
